name: Deploy AILYT Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      HOSTINGER_HOST: 89.117.27.253
      HOSTINGER_PORT: "65002"
      HOSTINGER_USERNAME: u641600243
      LIVE_PATH: /home/u641600243/domains/ailyt.in/public_html

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        working-directory: client
        run: npm install

      - name: Build React frontend
        working-directory: client
        env:
          CI: "false"
        run: npm run build

      - name: Verify build files
        shell: bash
        run: |
          set -e

          test -f client/build/index.html
          test -f client/build/asset-manifest.json
          test -d client/build/static
          test -f client/build/.htaccess

          # Verify intern images are included in the React build
          test -d client/build/images
          test -d client/build/images/interns
          test -f client/build/images/interns/anushka.jpg
          test -f client/build/images/interns/vidushi-arora.jpg

          echo "React build and intern images verified successfully"

      - name: Install SSH password utility
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Add Hostinger to known hosts
        shell: bash
        run: |
          set -e

          mkdir -p ~/.ssh

          for attempt in 1 2 3 4 5; do
            if ssh-keyscan \
              -T 15 \
              -H \
              -p "$HOSTINGER_PORT" \
              "$HOSTINGER_HOST" \
              >> ~/.ssh/known_hosts; then

              echo "Hostinger added to known hosts"
              exit 0
            fi

            echo "ssh-keyscan attempt $attempt failed. Retrying..."
            sleep 5
          done

          echo "Unable to add Hostinger to known hosts"
          exit 1

      - name: Test Hostinger connection
        shell: bash
        env:
          SSHPASS: ${{ secrets.HOSTINGER_PASSWORD }}
        run: |
          set -e

          sshpass -e ssh \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            -o BatchMode=no \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes \
            -p "$HOSTINGER_PORT" \
            "$HOSTINGER_USERNAME@$HOSTINGER_HOST" \
            "echo Hostinger connection successful"

      - name: Create temporary deployment folder
        shell: bash
        env:
          SSHPASS: ${{ secrets.HOSTINGER_PASSWORD }}
        run: |
          set -e

          sshpass -e ssh \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes \
            -p "$HOSTINGER_PORT" \
            "$HOSTINGER_USERNAME@$HOSTINGER_HOST" \
            "
              set -e
              rm -rf '$LIVE_PATH/deploy-temp'
              mkdir -p '$LIVE_PATH/deploy-temp'
            "

      - name: Upload React build
        shell: bash
        env:
          SSHPASS: ${{ secrets.HOSTINGER_PASSWORD }}
        run: |
          set -e

          tar -C client/build -czf - . | sshpass -e ssh \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes \
            -p "$HOSTINGER_PORT" \
            "$HOSTINGER_USERNAME@$HOSTINGER_HOST" \
            "tar -xzf - -C '$LIVE_PATH/deploy-temp'"

      - name: Backup and publish frontend
        shell: bash
        env:
          SSHPASS: ${{ secrets.HOSTINGER_PASSWORD }}
        run: |
          set -e

          sshpass -e ssh \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes \
            -p "$HOSTINGER_PORT" \
            "$HOSTINGER_USERNAME@$HOSTINGER_HOST" \
            "
              set -e

              LIVE='$LIVE_PATH'
              TEMP='$LIVE_PATH/deploy-temp'
              BACKUP='$LIVE_PATH/auto-backup'

              # Verify temporary deployment
              test -f \"\$TEMP/index.html\"
              test -f \"\$TEMP/asset-manifest.json\"
              test -d \"\$TEMP/static\"
              test -f \"\$TEMP/.htaccess\"

              # NEW: verify images exist
              test -d \"\$TEMP/images\"
              test -d \"\$TEMP/images/interns\"
              test -f \"\$TEMP/images/interns/anushka.jpg\"

              # Prepare backup
              rm -rf \"\$BACKUP\"
              mkdir -p \"\$BACKUP\"

              if [ -f \"\$LIVE/index.html\" ]; then
                cp \"\$LIVE/index.html\" \"\$BACKUP/\"
              fi

              if [ -f \"\$LIVE/asset-manifest.json\" ]; then
                cp \"\$LIVE/asset-manifest.json\" \"\$BACKUP/\"
              fi

              if [ -f \"\$LIVE/.htaccess\" ]; then
                cp \"\$LIVE/.htaccess\" \"\$BACKUP/\"
              fi

              if [ -d \"\$LIVE/static\" ]; then
                cp -r \"\$LIVE/static\" \"\$BACKUP/\"
              fi

              # NEW: backup existing images
              if [ -d \"\$LIVE/images\" ]; then
                cp -r \"\$LIVE/images\" \"\$BACKUP/\"
              fi

              # Remove old frontend assets
              rm -rf \"\$LIVE/static\"
              rm -rf \"\$LIVE/images\"

              # Publish new frontend
              cp \"\$TEMP/index.html\" \"\$LIVE/index.html\"
              cp \"\$TEMP/asset-manifest.json\" \"\$LIVE/asset-manifest.json\"
              cp \"\$TEMP/.htaccess\" \"\$LIVE/.htaccess\"

              cp -r \"\$TEMP/static\" \"\$LIVE/static\"

              # NEW: publish images to public_html/images
              cp -r \"\$TEMP/images\" \"\$LIVE/images\"

              # Confirm images were deployed
              test -f \"\$LIVE/images/interns/anushka.jpg\"
              test -f \"\$LIVE/images/interns/vidushi-arora.jpg\"

              rm -rf \"\$TEMP\"

              echo 'Deployment completed successfully'
              echo 'Intern images deployed successfully'
            "

      - name: Verify deployed website
        shell: bash
        run: |
          set -e

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            https://ailyt.in/ \
            > /dev/null

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            https://ailyt.in/admin-intern-tool \
            > /dev/null

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            https://ailyt.in/verify-intern/4H7W2K85 \
            > /dev/null

          # NEW: verify intern image is publicly accessible
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            https://ailyt.in/images/interns/anushka.jpg \
            > /dev/null

          echo "Website, React routes and intern images verified successfully"