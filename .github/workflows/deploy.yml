name: Deploy AILYT Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      HOSTINGER_HOST: 89.117.27.253
      HOSTINGER_PORT: "65002"
      HOSTINGER_USERNAME: u641600243
      LIVE_PATH: /home/u641600243/domains/ailyt.in/public_html

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        working-directory: client
        run: npm install

      - name: Build React frontend
        working-directory: client
        env:
          CI: "false"
        run: npm run build

      - name: Verify build files
        shell: bash
        run: |
          set -e
          test -f client/build/index.html
          test -f client/build/asset-manifest.json
          test -d client/build/static
          echo "React build verified successfully"

      - name: Install SSH password utility
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Add Hostinger to known hosts
        shell: bash
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H \
            -p "$HOSTINGER_PORT" \
            "$HOSTINGER_HOST" \
            >> ~/.ssh/known_hosts

      - name: Test Hostinger connection
        shell: bash
        env:
          SSHPASS: ${{ secrets.HOSTINGER_PASSWORD }}
        run: |
          sshpass -e ssh \
            -o BatchMode=no \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes \
            -p "$HOSTINGER_PORT" \
            "$HOSTINGER_USERNAME@$HOSTINGER_HOST" \
            "echo Hostinger connection successful"

      - name: Create temporary deployment folder
        shell: bash
        env:
          SSHPASS: ${{ secrets.HOSTINGER_PASSWORD }}
        run: |
          sshpass -e ssh \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes \
            -p "$HOSTINGER_PORT" \
            "$HOSTINGER_USERNAME@$HOSTINGER_HOST" \
            "rm -rf '$LIVE_PATH/deploy-temp' && mkdir -p '$LIVE_PATH/deploy-temp'"

      - name: Upload React build
        shell: bash
        env:
          SSHPASS: ${{ secrets.HOSTINGER_PASSWORD }}
        run: |
          tar -C client/build -czf - . | sshpass -e ssh \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes \
            -p "$HOSTINGER_PORT" \
            "$HOSTINGER_USERNAME@$HOSTINGER_HOST" \
            "tar -xzf - -C '$LIVE_PATH/deploy-temp'"

      - name: Backup and publish frontend
        shell: bash
        env:
          SSHPASS: ${{ secrets.HOSTINGER_PASSWORD }}
        run: |
          sshpass -e ssh \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes \
            -p "$HOSTINGER_PORT" \
            "$HOSTINGER_USERNAME@$HOSTINGER_HOST" \
            "
              set -e

              LIVE='$LIVE_PATH'
              TEMP='$LIVE_PATH/deploy-temp'
              BACKUP='$LIVE_PATH/auto-backup'

              test -f \"\$TEMP/index.html\"
              test -f \"\$TEMP/asset-manifest.json\"
              test -d \"\$TEMP/static\"

              rm -rf \"\$BACKUP\"
              mkdir -p \"\$BACKUP\"

              if [ -f \"\$LIVE/index.html\" ]; then
                cp \"\$LIVE/index.html\" \"\$BACKUP/\"
              fi

              if [ -f \"\$LIVE/asset-manifest.json\" ]; then
                cp \"\$LIVE/asset-manifest.json\" \"\$BACKUP/\"
              fi

              if [ -d \"\$LIVE/static\" ]; then
                cp -r \"\$LIVE/static\" \"\$BACKUP/\"
              fi

              rm -rf \"\$LIVE/static\"

              cp \"\$TEMP/index.html\" \"\$LIVE/index.html\"
              cp \"\$TEMP/asset-manifest.json\" \"\$LIVE/asset-manifest.json\"
              cp -r \"\$TEMP/static\" \"\$LIVE/static\"

              rm -rf \"\$TEMP\"

              echo 'Deployment completed successfully'
            "

      - name: Verify deployed website
        shell: bash
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 5 \
            https://ailyt.in/ \
            > /dev/null

          echo "Website verification successful"