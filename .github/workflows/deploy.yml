name: Deploy AILYT Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        working-directory: client
        run: npm install

      - name: Build React frontend
        working-directory: client
        env:
          CI: "false"
        run: npm run build

      - name: Configure SSH
        shell: bash
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.HOSTINGER_SSH_KEY_B64 }}" \
            | base64 --decode \
            > ~/.ssh/ailyt_deploy
          chmod 600 ~/.ssh/ailyt_deploy
          ssh-keygen -y -f ~/.ssh/ailyt_deploy > /dev/null
          ssh-keyscan -H \
            -p "${{ secrets.HOSTINGER_PORT }}" \
            "${{ secrets.HOSTINGER_HOST }}" \
            >> ~/.ssh/known_hosts

      - name: Show SSH key fingerprint
        shell: bash
        run: |
          ssh-keygen -y -f ~/.ssh/ailyt_deploy | ssh-keygen -lf -

      - name: Test Hostinger SSH connection
        shell: bash
        run: |
          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -i ~/.ssh/ailyt_deploy \
            -p "${{ secrets.HOSTINGER_PORT }}" \
            "${{ secrets.HOSTINGER_USERNAME }}@${{ secrets.HOSTINGER_HOST }}" \
            "echo SSH connection successful"

      - name: Create temporary deployment folder
        shell: bash
        run: |
          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -i ~/.ssh/ailyt_deploy \
            -p "${{ secrets.HOSTINGER_PORT }}" \
            "${{ secrets.HOSTINGER_USERNAME }}@${{ secrets.HOSTINGER_HOST }}" \
            "rm -rf /home/${{ secrets.HOSTINGER_USERNAME }}/domains/ailyt.in/public_html/deploy-temp && mkdir -p /home/${{ secrets.HOSTINGER_USERNAME }}/domains/ailyt.in/public_html/deploy-temp"

      - name: Upload React build
        shell: bash
        run: |
          tar -C client/build -czf - . | ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -i ~/.ssh/ailyt_deploy \
            -p "${{ secrets.HOSTINGER_PORT }}" \
            "${{ secrets.HOSTINGER_USERNAME }}@${{ secrets.HOSTINGER_HOST }}" \
            "tar -xzf - -C /home/${{ secrets.HOSTINGER_USERNAME }}/domains/ailyt.in/public_html/deploy-temp"

      - name: Backup and publish frontend
        shell: bash
        run: |
          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -i ~/.ssh/ailyt_deploy \
            -p "${{ secrets.HOSTINGER_PORT }}" \
            "${{ secrets.HOSTINGER_USERNAME }}@${{ secrets.HOSTINGER_HOST }}" << 'EOF'
              set -e

              LIVE="/home/${{ secrets.HOSTINGER_USERNAME }}/domains/ailyt.in/public_html"
              TEMP="$LIVE/deploy-temp"
              BACKUP="$LIVE/auto-backup"

              test -f "$TEMP/index.html"
              test -f "$TEMP/asset-manifest.json"
              test -d "$TEMP/static"

              rm -rf "$BACKUP"
              mkdir -p "$BACKUP"

              if [ -f "$LIVE/index.html" ]; then
                cp "$LIVE/index.html" "$BACKUP/"
              fi

              if [ -f "$LIVE/asset-manifest.json" ]; then
                cp "$LIVE/asset-manifest.json" "$BACKUP/"
              fi

              if [ -d "$LIVE/static" ]; then
                cp -r "$LIVE/static" "$BACKUP/"
              fi

              rm -rf "$LIVE/static"

              cp "$TEMP/index.html" "$LIVE/index.html"
              cp "$TEMP/asset-manifest.json" "$LIVE/asset-manifest.json"
              cp -r "$TEMP/static" "$LIVE/static"

              rm -rf "$TEMP"

              echo "Deployment completed successfully"
          EOF

      - name: Verify deployed website
        shell: bash
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 5 \
            https://ailyt.in/ \
            > /dev/null